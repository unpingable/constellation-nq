[[surfaces]]
id = "coarse-index-columns"
kind = "store"
class = "non_testimonial"
entry_point = "crates/nq-store/src/schema.sql"
allowed_uses = ["stable comparison", "bounded indexing", "metrics grouping"]
forbidden_uses = [
  "operator diagnosis without the linked typed payload",
  "qualification predicate without the linked typed payload",
  "archive testimony without the linked typed payload",
]

[[surfaces]]
id = "success-control-flow"
kind = "cli"
class = "non_testimonial"
entry_point = "crates/nq-core/src/engine.rs"
allowed_uses = ["scheduler cadence selection", "process exit selection after rendering the full result"]
forbidden_uses = [
  "refusal diagnosis",
  "stored judgment",
  "replacement for the typed collection result",
]

[[projections]]
file = "crates/nq-core/src/engine.rs"
function = "acquisition_code"
runtime_type = "nq_core::runner::AcquisitionOutcome"
classification = "non_testimonial"
allowed_uses = ["stable comparison", "bounded indexing", "metrics grouping"]
forbidden_uses = [
  "operator diagnosis",
  "qualification predicate",
  "archive testimony without the exact AcquisitionFailure.outcome",
]

[[projections]]
file = "crates/nq-core/src/engine.rs"
function = "semantic_report_status"
runtime_type = "nq_profiles::SemanticReportStatus"
classification = "internal"
allowed_uses = ["exact enum-token rendering"]
forbidden_uses = ["refusal diagnosis"]

[[projections]]
file = "crates/nq-profiles/src/descriptor.rs"
owner_type = "ProfileDigest"
function = "as_str"
runtime_type = "nq_profiles::ProfileDigest"
classification = "internal"
allowed_uses = ["digest-token rendering"]
forbidden_uses = ["qualification result"]

[[projections]]
file = "crates/nq-profiles/src/identity.rs"
owner_type = "ProfileSemanticId"
function = "as_str"
runtime_type = "nq_profiles::ProfileSemanticId"
classification = "internal"
allowed_uses = ["semantic-identity-token rendering"]
forbidden_uses = ["qualification result"]

[[projections]]
file = "crates/nq-protocol/src/canonical.rs"
owner_type = "Sha256Digest"
function = "as_str"
runtime_type = "nq_protocol::Sha256Digest"
classification = "internal"
allowed_uses = ["digest-token rendering"]
forbidden_uses = ["qualification result"]

# SQL columns, serde discriminants, and the boolean `is_success` method are not
# function-shaped string projections, so the framework census cannot discover
# them. Their non-testimonial classifications and exact linked-payload rules
# are owned by REFUSAL_PRESERVATION_CROSSWALK.md.

[controls.AC-R4-001]
runtime_type = "nq_core::runner::AcquisitionOutcome"
coarse_projection = "acquisition_code"
testimonial_surfaces = [
  "protocol-wire",
  "product-result-wire",
  "collection-cli",
  "daemon-log",
  "sqlite-history",
  "status-read-model",
  "local-api",
  "cold-archive",
]
non_testimonial_surfaces = ["coarse-index-columns", "success-control-flow"]

[[controls.AC-R4-001.evidence_commands]]
id = "helper-protocol-wire-preserves-refusal-pair"
