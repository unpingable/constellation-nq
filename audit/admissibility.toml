[[controls.AC-R4-003.mutations]]
id = "rederive-status-detail-from-code"
operator = "recompute-from-code"
file = "crates/nq-core/src/engine.rs"
find = '''        let result = decode_collection_outcome(detail_json.as_bytes()).map_err(|error| {
            EngineError::Invariant(format!(
                "instance status {component_id} is not a valid versioned collection result: {error}"
            ))
        })?;'''
replace = '''        let stored_result = decode_collection_outcome(detail_json.as_bytes()).map_err(|error| {
            EngineError::Invariant(format!(
                "instance status {component_id} is not a valid versioned collection result: {error}"
            ))
        })?;
        let result = if code == "collection_failed" {
            CollectionOutcome::acquisition_failed(
                component_id.clone(),
                stored_result
                    .run_id
                    .clone()
                    .unwrap_or_else(|| "code-derived-run".to_owned()),
                AcquisitionOutcome::Timeout,
            )?
        } else {
            stored_result
        };'''
command = ["cargo", "test", "--offline", "-p", "nq-core", "engine::tests::status_store_and_backup_preserve_same_code_distinct_detail", "--", "--exact"]
