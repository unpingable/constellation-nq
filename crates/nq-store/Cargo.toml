[package]
name = "nq-store"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = []
test-support = [
    "nq-host-role-dependency-custody/test-support",
    "nq-runtime-dependency-authority/test-support",
]

[dependencies]
chrono.workspace = true
ed25519-dalek.workspace = true
hex.workspace = true
libc.workspace = true
nix = { workspace = true, features = ["time"] }
nq-host-role-contract = { path = "../nq-host-role-contract" }
nq-host-role-dependency-custody = { path = "../nq-host-role-dependency-custody" }
nq-protocol = { path = "../nq-protocol" }
nq-runtime-dependency-authority = { path = "../nq-runtime-dependency-authority" }
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
uuid.workspace = true

[dev-dependencies]
nq-host-role-dependency-custody = { path = "../nq-host-role-dependency-custody", features = ["test-support"] }
nq-runtime-dependency-authority = { path = "../nq-runtime-dependency-authority", features = ["test-support"] }
tempfile.workspace = true
trybuild = "1.0.118"

[lints]
workspace = true
