[package]
name = "nq-host-role-runtime"
description = "Restart-safe host-role runtime ledger bridge for NQ"
readme = "README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true

[lib]
path = "src/facade.rs"

[features]
default = []
test-support = [
    "nq-store/test-support",
]

[dependencies]
chrono.workspace = true
ed25519-dalek.workspace = true
hex.workspace = true
nix = { workspace = true, features = ["time"] }
nq-host-role-contract = { path = "../nq-host-role-contract" }
nq-host-role-dependency-custody = { path = "../nq-host-role-dependency-custody" }
nq-protocol = { path = "../nq-protocol" }
nq-runtime-dependency-authority = { path = "../nq-runtime-dependency-authority" }
nq-store = { path = "../nq-store" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
nq-host-role-dependency-custody = { path = "../nq-host-role-dependency-custody", features = ["test-support"] }
nq-runtime-dependency-authority = { path = "../nq-runtime-dependency-authority", features = ["test-support"] }
rusqlite.workspace = true
tempfile.workspace = true

[lints]
workspace = true
