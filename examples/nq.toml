# Strict nq.config.v1 example for the standard-library Python conformance
# specimen. Installing nq-ng never copies this file into /etc automatically.
schema = "nq.config.v1"
database_path = "/var/lib/nq/nq.db"
socket_path = "/run/nq/nqd.sock"
admissions_dir = "/var/lib/nq/admissions"
helper_runtime_dir = "/run/nq/helpers"

[[watchers]]
instance_id = "conformance-local"
carrier = "stdio"
subject = "conformance:fixture-1"
capability_ceiling = []
checkpoint_policy = "disabled"

[watchers.command]
executable = "/usr/lib/nq/helpers/nq_conformance_helper.py"
args = []
env = {}
execution_account = "nq-helper"
working_directory = "/usr/lib/nq/helpers"

[watchers.profile]
id = "nq.conformance"
version = 1

[watchers.scope]
kind = "fixture"
value = { id = "fixture-1", nonce = "replace-with-a-local-nonce" }

[watchers.vantage]
kind = "local"
value = {}

[watchers.schedule]
interval_seconds = 300
jitter_seconds = 15
deadline_ms = 30000
retry_backoff_seconds = 10
max_retry_backoff_seconds = 300

[watchers.resources]
max_response_bytes = 1048576
max_stderr_bytes = 65536
max_observations = 1
max_address_space_bytes = 536870912
max_cpu_seconds = 60
max_processes = 32
max_open_files = 128
max_file_bytes = 67108864
